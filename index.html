<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fahrzeugverwaltung</title>
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2563EB">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- Header im blauen Reise-App-Stil -->
  <header id="app-header" class="app-header" style="display:none;">
    <div class="header-content">
      <div class="header-brand">
        <img src="icons/icon-192.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <span class="app-title">Fahrzeugverwaltung</span>
      </div>
      <nav class="header-nav">
        <a href="#/dashboard" class="nav-pill active">Dashboard</a>
        <a href="#/admin" id="nav-admin" class="nav-pill" style="display: none;">Admin</a>
        <a href="#/settings" class="nav-pill">Einstellungen</a>
        <button id="btn-logout" class="nav-pill nav-pill-logout" onclick="import('./js/auth.js').then(m => m.logoutUser().catch(() => window.location.reload()))">Abmelden</button>
      </nav>
    </div>
  </header>

  <main id="app-content" class="app-main">
    <!-- Dynamischer Inhalt -->
  </main>

  <script type="module" src="js/router.js?v=5"></script>
</body>
</html>
